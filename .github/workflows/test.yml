name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SIDECAR_REF: d576d010a634215703ee70c2620a1361f6251b5d

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  browsers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ores-otel/ores-otel-sidecar.rs
          ref: ${{ env.SIDECAR_REF }}
          path: sidecar
          persist-credentials: false
      - name: Verify exact sidecar source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sidecar rev-parse HEAD)" = "$SIDECAR_REF"
          grep -Fqx 'load = false' sidecar/.cli-flags.toml
          grep -Fqx 'files = []' sidecar/.cli-flags.toml
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - run: cargo build --locked --bin ores-otel-sidecar
        working-directory: sidecar
      - name: Exercise owner startup admission before browser smoke
        working-directory: sidecar
        run: ./target/debug/ores-otel-sidecar preflight
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Serve sidecar and run Playwright, Puppeteer, and Selenium
        env:
          SIDECAR_URL: http://127.0.0.1:19090
          ORES_OTEL_SIDECAR_BIND: 127.0.0.1:19090
        run: |
          set -euo pipefail
          (
            cd sidecar
            exec ./target/debug/ores-otel-sidecar
          ) &
          sidecar_pid=$!
          trap 'kill "$sidecar_pid" 2>/dev/null || true' EXIT
          for _probe_attempt in {1..50}; do
            if curl -sf "$SIDECAR_URL/healthz" >/dev/null; then
              break
            fi
            sleep 0.1
          done
          curl -sf "$SIDECAR_URL/healthz" >/dev/null
          npm test
